displayName: "OneGoal1Crore - High Error Rate Alert"
documentation:
  content: "Alert when Cloud Functions error rate exceeds 5% over 5 minutes"
  mimeType: "text/markdown"
conditions:
  - displayName: "Cloud Function Error Rate > 5%"
    conditionThreshold:
      filter: 'resource.type="cloud_function" AND resource.label.function_name=~"callAIChat|checkSubscriptionStatus|createRazorpaySubscription"'
      comparison: COMPARISON_GREATER_THAN
      thresholdValue: 0.05
      duration: "300s"
      aggregations:
        - alignmentPeriod: "60s"
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_MEAN
          groupByFields:
            - "resource.label.function_name"
combiner: OR
enabled: true
notificationChannels: []
alertStrategy:
  autoClose: "1800s" 